# XcodeGen spec: `xcodegen generate` writes AIOStreamsTV.xcodeproj from this file.
name: AIOStreamsTV
options:
  bundleIdPrefix: io.github.aiostreams
  deploymentTarget:
    tvOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Set this to your Apple Developer team ID, or pick the team in Xcode.
    DEVELOPMENT_TEAM: ""
targets:
  AIOStreamsTV:
    type: application
    platform: tvOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - Fonts
      # A folder in the app, for libass to read the subtitle font from.
      - path: App/Fonts
        type: folder
        buildPhase: resources
      # The web app's standalone build, from scripts/fetch-web.sh. Kept outside App:
      # macOS ignores case in names, so App/web would be the same folder as App/Web.
      - path: WebBuild
        type: folder
        buildPhase: resources
        optional: true
    settings:
      base:
        PRODUCT_NAME: AIOStreams
        PRODUCT_BUNDLE_IDENTIFIER: io.github.aiostreams.tvos
        INFOPLIST_FILE: App/Info.plist
        TARGETED_DEVICE_FAMILY: "3"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "1"
        # The WKWebView wrapper is Objective-C, as WebKit is only reached through the runtime.
        SWIFT_OBJC_BRIDGING_HEADER: App/AIOStreamsTV-Bridging-Header.h
        CLANG_ENABLE_OBJC_ARC: YES
        # WebKit is loaded at runtime; nothing links against it.
        GCC_WARN_UNDECLARED_SELECTOR: NO
        # MPVKit is one static library; this keeps its Objective-C (vo_avfoundation) linked in.
        OTHER_LDFLAGS: ["$(inherited)", "-ObjC"]
    dependencies:
      # Streamyfin's MPVKit, with vo_avfoundation for HDR; from scripts/fetch-mpvkit.sh.
      - framework: Vendor/MPVKit.xcframework
        embed: false
      - sdk: MediaPlayer.framework
      - sdk: AVFoundation.framework
      - sdk: AVKit.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreAudio.framework
      - sdk: CoreFoundation.framework
      - sdk: CoreImage.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: VideoToolbox.framework
      - sdk: libbz2.tbd
      - sdk: libc++.tbd
      - sdk: libexpat.tbd
      - sdk: libiconv.tbd
      - sdk: libresolv.tbd
      - sdk: libxml2.tbd
      - sdk: libz.tbd
